[package]
name = "notchlink"
version = "0.1.0"
description = "A notch island and dock for Windows"
authors = ["fab19n"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin on Windows.
name = "notchlink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
base64 = "0.22"
tauri-plugin-global-shortcut = "2"

windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
wmi = { version = "0.18", default-features = false }

# Optimise dependencies even in dev builds: window snapshots are PNG-encoded,
# which is very slow unoptimised. Our own code still compiles fast.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
